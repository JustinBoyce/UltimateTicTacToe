# Activated with: SPRING_PROFILES_ACTIVE=prod (set via env or CLI—not only in .env; see API/.env.example)
# Optional secrets file (gitignored): copy API/.env.example to API/.env
spring.config.import=optional:file:.env[.properties]

# To prevent Tomcat from starting and taking port 8080
spring.main.web-application-type=none

# Supabase PostgreSQL (password required via DATABASE_PASSWORD env or .env)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

socket-server.host=${SOCKET_SERVER_HOST:0.0.0.0}
socket-server.port=${PORT}
socket-server.allowed-origins=${ALLOWED_ORIGINS:https://justinboyce.github.io}
