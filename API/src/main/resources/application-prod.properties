# Activated with: SPRING_PROFILES_ACTIVE=prod (set via env or CLI—not only in .env; see API/.env.example)
# Optional secrets file (gitignored): copy API/.env.example to API/.env
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL (password required via DATABASE_PASSWORD env or .env)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.hqovvjvdzrzageebeecx.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# For production, set SOCKET_SERVER_ALLOWED_ORIGINS to your hosted frontend origin
# (e.g. https://yourusername.github.io). Wildcard "*" is insecure—use only if you understand the tradeoff.

socket-server.host=${SOCKET_SERVER_HOST:0.0.0.0}
socket-server.port=${SOCKET_SERVER_PORT:8085}
socket-server.allowed-origins=${SOCKET_SERVER_ALLOWED_ORIGINS:*}
