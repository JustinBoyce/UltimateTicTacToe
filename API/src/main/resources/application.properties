spring.application.name=utttapi

# Shared defaults. Use profiles `local` / `prod` (see application-*.properties) and/or env vars.
# Env examples: SOCKET_SERVER_HOST, SOCKET_SERVER_PORT, SOCKET_SERVER_ALLOWED_ORIGINS
socket-server.port=${SOCKET_SERVER_PORT:8085}
socket-server.host=${SOCKET_SERVER_HOST:localhost}
# Default: Vite dev server. Override per environment (see profile files).
socket-server.allowed-origins=${SOCKET_SERVER_ALLOWED_ORIGINS:http://localhost:5173}