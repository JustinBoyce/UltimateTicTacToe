# Activated with: SPRING_PROFILES_ACTIVE=local (or --spring.profiles.active=local)
# Suited for running the API alongside Vite on the same machine.

socket-server.host=${SOCKET_SERVER_HOST:localhost}
socket-server.port=${SOCKET_SERVER_PORT:8085}
# Vite default dev server; override with SOCKET_SERVER_ALLOWED_ORIGINS if needed.
socket-server.allowed-origins=${SOCKET_SERVER_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
